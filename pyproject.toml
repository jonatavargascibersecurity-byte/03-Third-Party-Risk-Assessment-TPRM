[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tprm"
version = "1.0.0"
description = "Third-Party Risk Assessment (TPRM) toolkit - vendor risk scoring, due diligence and contract monitoring"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Carlos Caceres" }]
keywords = ["tprm", "third-party-risk", "grc", "vendor-risk", "dora", "lgpd", "cybersecurity"]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
tprm = "tprm.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"
